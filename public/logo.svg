<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="Security Tech: cofre cibernético">
  <title>Security Tech</title>
  <defs>
    <linearGradient id="chassis" x1="10" y1="14" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a1a52"/>
      <stop offset="1" stop-color="#140b2b"/>
    </linearGradient>
    <linearGradient id="lid" x1="8" y1="14" x2="56" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a2470"/>
      <stop offset="1" stop-color="#1c1040"/>
    </linearGradient>
    <linearGradient id="gem" x1="26" y1="28" x2="38" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eafcff"/>
      <stop offset=".55" stop-color="#22e8ff"/>
      <stop offset="1" stop-color="#ff2fd0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- cuerpo del cofre (voxel) -->
  <rect x="8" y="30" width="48" height="24" rx="2" fill="url(#chassis)"/>
  <rect x="8" y="30" width="48" height="24" rx="2" fill="none" stroke="#ff2fd0" stroke-opacity=".9" stroke-width="1.4"/>

  <!-- tapa abombada -->
  <path d="M8 30c0-9.5 6-16.5 24-16.5S56 20.5 56 30z" fill="url(#lid)"/>
  <path d="M8 30c0-9.5 6-16.5 24-16.5S56 20.5 56 30" fill="none" stroke="#22e8ff" stroke-width="1.6"/>

  <!-- franjas metálicas (remaches luminosos) -->
  <g fill="none" stroke="#22e8ff" stroke-width="1.1" stroke-opacity=".85">
    <path d="M13 30V17.5"/>
    <path d="M51 30V17.5"/>
    <path d="M8 38h48"/>
  </g>
  <g fill="#ff2fd0" filter="url(#glow)">
    <circle cx="13" cy="19" r="1.3"/>
    <circle cx="51" cy="19" r="1.3"/>
    <circle cx="11" cy="38" r="1.2"/>
    <circle cx="53" cy="38" r="1.2"/>
    <circle cx="11" cy="51" r="1.2"/>
    <circle cx="53" cy="51" r="1.2"/>
  </g>

  <!-- trazas de circuito sobre el cuerpo -->
  <g fill="none" stroke="#5ff0ff" stroke-width="1" stroke-opacity=".55" stroke-linecap="round">
    <path d="M14 45h7m0 0v4m0-4 4-3"/>
    <path d="M50 45h-7m0 0v4m0-4-4-3"/>
  </g>

  <!-- cerradura: gema con forma de escudo, en vez de ojo de llave -->
  <rect x="26" y="29" width="12" height="9" rx="2" fill="#0d0820" stroke="#ff2fd0" stroke-width="1.3"/>
  <path d="M32 31.3 36 33v3.1c0 2.2-1.7 3.6-4 4.3-2.3-.7-4-2.1-4-4.3V33z" fill="url(#gem)" filter="url(#glow)"/>
</svg>
